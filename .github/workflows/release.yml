name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Everything that runs third-party code happens here, with a read-only token.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Tag matches manifest version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != manifest v$version"; exit 1; }
      - run: npm run build
      - name: Checksum and release notes
        run: |
          cd dist && sha256sum *.zip > SHA256SUMS.txt && cd ..
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # Only this job can write, and it runs no project or dependency code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --title "Vimeo Grab ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md --verify-tag
